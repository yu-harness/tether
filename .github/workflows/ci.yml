name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[tracing]"
          python -m pip install pytest

      - name: 单元测试
        run: python -m pytest tests -q
